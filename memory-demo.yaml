apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-demo
  template:
    metadata:
      labels:
        app: memory-demo
    spec:
      containers:
      - name: stress
        image: polinux/stress
        resources:
          limits:
            memory: "64Mi"
          requests:
            memory: "64Mi"
        command: ["stress"]
        args: ["--vm", "1", "--vm-bytes", "150M", "--vm-hang", "1"]
